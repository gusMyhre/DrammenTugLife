<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Flappy Boys</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070b18;
      color: #fff;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      text-align: center;
      padding: 0 16px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .subtitle {
      opacity: 0.8;
      margin-bottom: 24px;
    }

    .group-image {
      width: 100%;
      max-width: 600px;
      height: 300px;
      object-fit: cover;
      border-radius: 16px;
      border: 3px solid #fff;
      margin-bottom: 24px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 0.9rem;
    }

    /* Countdown */
    .countdown-box {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 24px;
    }

    .countdown-label {
      font-size: 4.0rem;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .countdown-time {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 1.1rem;
    }

    .countdown-part span {
      font-weight: bold;
      display: block;
    }

    /* Bird button */
    .bird-wrapper {
      margin-top: 30px;
      margin-bottom: 8px;
      position: relative;
      height: 120px;
    }

    .bird-button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffdd33;
      border: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      position: absolute;
      left: calc(50% - 30px);
      top: 30px;
      animation: fly 3s ease-in-out infinite alternate;
      box-shadow: 0 0 16px rgba(255, 221, 51, 0.7);
      user-select: none;
    }

    @keyframes fly {
      0%   { transform: translate(-80px, -10px) rotate(-10deg); }
      50%  { transform: translate(0px, 0px) rotate(0deg); }
      100% { transform: translate(80px, -15px) rotate(10deg); }
    }

    .bird-caption {
      opacity: 0.8;
      font-size: 0.95rem;
    }

    /* Game overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .overlay.hidden {
      display: none;
    }

    .start-btn {
        margin-top: 8px;
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 0.95rem;
    }

    .overlay-inner {
      background: #111623;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 24px rgba(0,0,0,0.6);
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: #fff;
    }

    .close-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 16px;
    }

    canvas {
      border-radius: 8px;
      background: #70c5ce;
      display: block;
    }

    .small-hint {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-top: 4px;
      text-align: right;
    }

    .is-hidden { display: none !important; }

    /* Top-right buttons */
    #topRight{
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10000;
      display: flex;
      gap: 10px;
    }
    
    .top-btn{
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    /* Fullscreen auth overlay */
    .auth-overlay{
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .auth-card{
      width: 100%;
      max-width: 520px;
      border: 1px solid rgba(255,255,255,0.25);
      background: #0d1222;
      border-radius: 16px;
      padding: 18px;
    }

    .auth-card label{
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .auth-card input{
      width: 100%;
      font-size: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #999;
    }

    .auth-actions{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .auth-btn{
      font-size: 16px;
      padding: 12px;
      border-radius: 12px;
      border: 0;
      cursor: pointer;
      background: #111;
      color: #fff;
    }

    .auth-btn.secondary{
      background: #222;
    }

    .auth-msg{
      min-height: 22px;
      margin-top: 10px;
    }

    .auth-muted{
      opacity: 0.7;
      margin: 10px 0 0;
    }



  </style>
</head>
<body>
   <!-- Fullscreen AUTH overlay -->

  <div class="auth-card">

<!-- Top-right actions (visible only when logged in) -->
<div id="topRight"></div>

<div id="appContent" class="is-hidden">

  <div class="container">
    <h1>Poop Togheter</h1>
     
    <!-- Replace this with a real image later -->
    <div class="group-image">
      Group photo goes here (add a real image file later)
    </div>

    <!-- Countdown -->
    <div class="countdown-box">
      <div class="countdown-label">Blåtur starter om:</div>
      <div class="countdown-time">
        <div class="countdown-part">
          <span id="days">0</span>d
        </div>
        <div class="countdown-part">
          <span id="hours">0</span>t
        </div>
        <div class="countdown-part">
          <span id="minutes">0</span>m
        </div>
        <div class="countdown-part">
          <span id="seconds">0</span>s
        </div>
      </div>
    </div>

    <!-- Bird button -->
    <div class="bird-wrapper">
      <div class="bird-button" id="birdButton">🐦</div>
    </div>
    <p class="bird-caption">Klikk på fuglen for å spille Flappy Boys</p>
  </div>

  <!-- Game overlay -->
  <div class="overlay hidden" id="gameOverlay">
    <div class="overlay-inner">
        <div class="overlay-header">
            <div>Flappy Boys – prototype</div>
            <button class="close-btn" id="closeGameBtn">&times;</button>
        </div>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="small-hint">Trykk SPACE eller klikk for å hoppe</div>
        <button id="startGameBtn" class="start-btn">Start / Restart</button>
    </div>
  </div>
</div> <!-- /#appContent -->

  <script>


    // ===============================
    // 1) COUNTDOWN (set your date)
    // ===============================
    // Example: 24 April 2026 18:00 (Norway time-ish)
    const targetDate = new Date("2026-04-24T09:00:00");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("days").innerText = 0;
        document.getElementById("hours").innerText = 0;
        document.getElementById("minutes").innerText = 0;
        document.getElementById("seconds").innerText = 0;
        return;
      }

      const seconds = Math.floor(diff / 1000);
      const days = Math.floor(seconds / (60 * 60 * 24));
      const hours = Math.floor((seconds % (60 * 60 * 24)) / (60 * 60));
      const minutes = Math.floor((seconds % (60 * 60)) / 60);
      const secs = seconds % 60;

      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = secs;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    // ===============================
    // 2) OPEN/CLOSE GAME OVERLAY
    // ===============================
    const birdButton = document.getElementById("birdButton");
    const gameOverlay = document.getElementById("gameOverlay");
    const closeGameBtn = document.getElementById("closeGameBtn");
    const startGameBtn = document.getElementById("startGameBtn");

    // Open overlay, show idle bird
    birdButton.addEventListener("click", () => {
    gameOverlay.classList.remove("hidden");
    stopGame();     // make sure nothing is running
    resetGame();    // reset positions & pipes
    draw();         // draw initial state
    });

    // Close overlay, stop game loop
    closeGameBtn.addEventListener("click", () => {
    gameOverlay.classList.add("hidden");
    stopGame();
    });

    // Start / restart round
    startGameBtn.addEventListener("click", () => {
    startGame();
    });

    // ===============================
    // 3) IMPROVED FLAPPY GAME (keeps overlay/countdown)
    // ===============================
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const GRAVITY = 1200;         // pixels per second^2
    const JUMP_FORCE = -400;    // pixels per second
    const PIPE_SPEED = 180;     // pixels per second
    const PIPE_GAP = 140;
    const PIPE_WIDTH = 70;
    const PIPE_INTERVAL = 1500; // ms

    const bird = {
      x: 80,
      y: canvas.height / 2,
      radius: 14,
      velocity: 0
    };

    let pipes = [];
    let lastPipeTime = 0;
    let score = 0;
    let bestScore = 0;

    let gameState = "start"; // start | running | gameover
    let lastTime = 0;
    let rafId = null;

    function resetGame() {
      bird.x = 80;
      bird.y = canvas.height / 2;
      bird.velocity = 0;
      pipes = [];
      score = 0;
      lastPipeTime = 0;
      lastTime = 0;
      gameState = "start";
    }

    function spawnPipe() {
      const minTop = 50;
      const maxTop = canvas.height - 50 - PIPE_GAP - 80; // leave room for ground
      const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

      pipes.push({
        x: canvas.width,
        top: topHeight,
        width: PIPE_WIDTH,
        gap: PIPE_GAP,
        scored: false
      });
    }

    function update(deltaTime) {
      if (gameState !== "running") return;

      // dt is already passed into update(dt)
      const dtSeconds = deltaTime / 1000; // convert ms to seconds

      bird.velocity += GRAVITY * dtSeconds;
      bird.y += bird.velocity * dtSeconds;

      if (lastPipeTime > PIPE_INTERVAL) {
        spawnPipe();
        lastPipeTime = 0;
      } else {
        lastPipeTime += deltaTime;
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const pipe = pipes[i];
        pipe.x -= PIPE_SPEED * dtSeconds;

        if (!pipe.scored && pipe.x + pipe.width < bird.x) {
          pipe.scored = true;
          score++;
          if (score > bestScore) bestScore = score;
        }

        if (pipe.x + pipe.width < 0) {
          pipes.splice(i, 1);
          }
      }

      if (checkCollision()) {
        gameState = "gameover";
      }

      if (bird.y + bird.radius > canvas.height || bird.y - bird.radius < 0) {
        gameState = "gameover";
      }
    }

    function checkCollision() {
      for (const pipe of pipes) {
        const birdLeft = bird.x - bird.radius;
        const birdRight = bird.x + bird.radius;
        const birdTop = bird.y - bird.radius;
        const birdBottom = bird.y + bird.radius;

        const pipeLeft = pipe.x;
        const pipeRight = pipe.x + pipe.width;
        const gapTop = pipe.top;
        const gapBottom = pipe.top + pipe.gap;

        const overlapsHorizontal = birdRight > pipeLeft && birdLeft < pipeRight;
        const hitsTopPipe = birdTop < gapTop;
        const hitsBottomPipe = birdBottom > gapBottom;

        if (overlapsHorizontal && (hitsTopPipe || hitsBottomPipe)) {
          return true;
        }
      }
      return false;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Sky
      ctx.fillStyle = "#70c5ce";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground
      ctx.fillStyle = "#ded895";
      ctx.fillRect(0, canvas.height - 80, canvas.width, 80);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(Math.min(Math.max(bird.velocity * 0.05, -0.5), 0.7));
      ctx.fillStyle = "#ffdd00";
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(5, -5, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(6, -5, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = "#ff8800";
      ctx.beginPath();
      ctx.moveTo(bird.radius, 0);
      ctx.lineTo(bird.radius + 8, 4);
      ctx.lineTo(bird.radius, 8);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Pipes
      for (const pipe of pipes) {
        ctx.fillStyle = "#39c000";
        ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
        ctx.fillRect(pipe.x, pipe.top + pipe.gap, pipe.width, canvas.height - (pipe.top + pipe.gap) - 80);

        ctx.fillStyle = "#2f9900";
        ctx.fillRect(pipe.x - 2, pipe.top - 18, pipe.width + 4, 18);
        ctx.fillRect(pipe.x - 2, pipe.top + pipe.gap, pipe.width + 4, 18);
      }

      // Score
      ctx.fillStyle = "#000";
      ctx.font = "bold 32px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(score.toString(), canvas.width / 2, 60);

      // Best score
      ctx.font = "bold 16px system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Best: " + bestScore, 10, 25);

      if (gameState === "start") {
        drawMessage("Click or SPACE to start", "Avoid the pipes!");
      } else if (gameState === "gameover") {
        drawMessage("Game Over", "Click or SPACE to restart");
      }
    }

    function drawMessage(title, subtitle) {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(40, canvas.height / 2 - 80, canvas.width - 80, 140);

      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.strokeRect(40, canvas.height / 2 - 80, canvas.width - 80, 140);

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "bold 24px system-ui, sans-serif";
      ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);
      ctx.font = "16px system-ui, sans-serif";
      ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 10);
      ctx.restore();
    }

    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const deltaTime = timestamp - lastTime;
      lastTime = timestamp;

      update(deltaTime);
      draw();

      rafId = requestAnimationFrame(gameLoop);
    }

    function flap() {
      if (gameState === "start") {
        gameState = "running";
        bird.velocity = JUMP_FORCE;
      } else if (gameState === "running") {
        bird.velocity = JUMP_FORCE;
      } else if (gameState === "gameover") {
        resetGame();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flap();
      }
    });

    canvas.addEventListener("mousedown", flap);
    canvas.addEventListener("touchstart", function (e) {
      e.preventDefault();
      flap();
    });

    function startGame() {
      stopGame();
      resetGame();
      gameState = "running";
      lastTime = 0;
      lastPipeTime = 0;
      rafId = requestAnimationFrame(gameLoop);
    }

    function stopGame() {
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
    }

    // draw initial state
    resetGame();
    draw();
  </script>

  const authOverlay = document.getElementById("authOverlay");
  const appContent  = document.getElementById("appContent");
  const topRight    = document.getElementById("topRight");
  const idxMsg      = document.getElementById("idxMsg");

  function setMsg(text, ok = false) {
    idxMsg.textContent = text;
    idxMsg.style.color = ok ? "#0a7a2f" : "#ff6b6b";
  }

  function makeBtn(text, onClick) {
    const b = document.createElement("button");
    b.textContent = text;
    b.className = "top-btn";
    b.onclick = onClick;
    return b;
  }

  async function refreshAuthUI(passedSession) {
    const { data: { session } } = passedSession
      ? { data: { session: passedSession } }
      : await supabase.auth.getSession();

    topRight.innerHTML = "";

    if (!session) {
      // Not logged in => show overlay, hide app
      authOverlay.classList.remove("is-hidden");
      appContent.classList.add("is-hidden");
      return;
    }

    // Logged in => hide overlay, show app
    authOverlay.classList.add("is-hidden");
    appContent.classList.remove("is-hidden");

    // Profile + logout
    topRight.appendChild(makeBtn("Your profile", () => {
      window.location.href = "./profile.html";
    }));

    topRight.appendChild(makeBtn("Log out", async () => {
      await supabase.auth.signOut();
      await refreshAuthUI();
    }));
  }

  document.getElementById("idxLoginBtn").addEventListener("click", async () => {
    setMsg("");
    const email = document.getElementById("idxEmail").value.trim().toLowerCase();
    const password = document.getElementById("idxPass").value;

    if (!email || !password) return setMsg("Enter email + password.");

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) return setMsg(error.message);

    setMsg("Logged in!", true);
    await refreshAuthUI(data.session);
  });

  document.getElementById("idxResetBtn").addEventListener("click", async () => {
    setMsg("");
    const email = document.getElementById("idxEmail").value.trim().toLowerCase();
    if (!email) return setMsg("Enter your email first.");

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: "https://gusmyhre.github.io/DrammenTugLife/reset.html"
    });

    if (error) return setMsg(error.message);
    setMsg("Reset email sent (check spam).", true);
  });

  // Keep UI synced
  supabase.auth.onAuthStateChange((_event, session) => refreshAuthUI(session));
  refreshAuthUI();
</script>
