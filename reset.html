<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset password</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 520px; margin: 60px auto; padding: 0 16px; }
    .card { border: 1px solid #333; border-radius: 14px; padding: 18px; }
    label { display:block; margin-top: 12px; margin-bottom: 4px; font-weight: 600; }
    input { width:100%; font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid #999; }
    button { width:100%; margin-top: 14px; font-size:16px; padding:12px; border-radius:12px; border:0; cursor:pointer; background:#111; color:#fff; }
    .msg { margin-top: 10px; min-height: 22px; }
    .error { color:#b00020; } .success { color:#0a7a2f; }
  </style>
</head>
<body>
  <h1>Set a new password</h1>
  <div class="card">
    <label>New password</label>
    <input id="newPass" type="password" placeholder="New password" />
    <button id="saveBtn">Save password</button>
    <div id="msg" class="msg"></div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://mzfonlfsfwvnkqqvrfzw.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16Zm9ubGZzZnd2bmtxcXZyZnp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQzMTYxMTcsImV4cCI6MjA3OTg5MjExN30.eWqdCcBUoiL4RAtDZZ7ZzTGBF5L9MsjOWY4ZhS0eNH0";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const msg = document.getElementById("msg");

    function setMsg(text, ok=false){
      msg.textContent = text;
      msg.className = "msg " + (ok ? "success" : "error");
    }

    document.getElementById("saveBtn").addEventListener("click", async () => {
      const password = document.getElementById("newPass").value;
      if (!password) return setMsg("Enter a new password.");

      const { error } = await supabase.auth.updateUser({ password });
      if (error) return setMsg(error.message);

      setMsg("Password updated! Going to index…", true);
      setTimeout(() => window.location.href = "./index.html", 600);
    });
  </script>
</body>
</html>
